[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnaroshi-vla-deployment"
version = "0.1.0"
description = "Reusable desktop deployment session, policy and embodiment adapters"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9"]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
ur5e = ["ur-rtde>=1.5", "pyrealsense2>=2.54", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
